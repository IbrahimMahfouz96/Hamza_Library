<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تواصل مع مكتبة حمزة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root {
    --bg: #f0f7ff;
    --card: #ffffff;
    --border: #e2eaf5;
    --wa: #25D366;
    --fb: #1877F2;
    --text: #1a1a2e;
    --muted: #888;
    --glow-wa: rgba(37, 211, 102, 0.1);
    --glow-fb: rgba(24, 119, 242, 0.1);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Cairo', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* Cheerful light background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: 
      radial-gradient(ellipse at 10% 20%, rgba(255, 220, 50, 0.15) 0%, transparent 50%),
      radial-gradient(ellipse at 90% 80%, rgba(24, 119, 242, 0.1) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 10%, rgba(37, 211, 102, 0.1) 0%, transparent 40%),
      radial-gradient(ellipse at 20% 90%, rgba(255, 150, 50, 0.08) 0%, transparent 40%);
    pointer-events: none;
  }

  .container {
    width: 100%;
    max-width: 420px;
    padding: 24px 20px;
    position: relative;
    animation: fadeUp 0.8s ease forwards;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .header {
    text-align: center;
    margin-bottom: 36px;
  }

  .avatar {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    overflow: hidden;
    margin: 0 auto 16px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    border: 3px solid #fff;
    animation: pulse 3s ease-in-out infinite;
  }

  .avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 30px rgba(37,211,102,0.3); }
    50% { box-shadow: 0 0 50px rgba(37,211,102,0.5); }
  }

  .header h1 {
    font-size: 1.6rem;
    font-weight: 900;
    letter-spacing: -0.5px;
    color: #1a1a2e;
  }

  .header p {
    color: #999;
    font-size: 0.85rem;
    margin-top: 6px;
    font-weight: 300;
  }

  .cards {
    display: flex;
    flex-direction: column;
    gap: 14px;
    margin-bottom: 32px;
  }

  .btn {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 18px 22px;
    border-radius: 16px;
    text-decoration: none;
    border: 1px solid var(--border);
    background: var(--card);
    transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    position: relative;
    overflow: hidden;
    cursor: pointer;
    animation: fadeUp 0.8s ease forwards;
  }

  .btn:nth-child(1) { animation-delay: 0.15s; opacity: 0; }
  .btn:nth-child(2) { animation-delay: 0.3s; opacity: 0; }

  .btn::before {
    content: '';
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity 0.3s;
  }

  .btn-wa::before { background: var(--glow-wa); }
  .btn-fb::before { background: var(--glow-fb); }

  .btn:hover::before { opacity: 1; }
  .btn:hover { transform: scale(1.02) translateY(-2px); border-color: transparent; }
  .btn-wa:hover { border-color: rgba(37,211,102,0.3); box-shadow: 0 8px 30px rgba(37,211,102,0.2); }
  .btn-fb:hover { border-color: rgba(24,119,242,0.3); box-shadow: 0 8px 30px rgba(24,119,242,0.2); }

  .btn:active { transform: scale(0.98); }

  .icon-wrap {
    width: 48px;
    height: 48px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .btn-wa .icon-wrap { background: rgba(37,211,102,0.15); }
  .btn-fb .icon-wrap { background: rgba(24,119,242,0.15); }

  .icon-wrap svg { width: 26px; height: 26px; }

  .btn-text { flex: 1; }
  .btn-text strong { display: block; font-size: 1rem; font-weight: 700; }
  .btn-text span { font-size: 0.78rem; color: var(--muted); font-weight: 300; }

  .arrow {
    color: var(--muted);
    font-size: 1.2rem;
    transition: transform 0.3s;
  }

  .btn:hover .arrow { transform: translateX(-4px); }

  /* QR Section */
  .qr-section {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 24px;
    text-align: center;
    animation: fadeUp 0.8s 0.45s ease forwards;
    opacity: 0;
  }

  .qr-label {
    font-size: 0.8rem;
    color: var(--muted);
    margin-bottom: 16px;
    letter-spacing: 2px;
    text-transform: uppercase;
    font-weight: 600;
  }

  .qr-wrap {
    display: inline-flex;
    padding: 12px;
    background: #fff;
    border-radius: 12px;
    margin-bottom: 12px;
  }

  #qrcode canvas, #qrcode img { border-radius: 6px; }

  .qr-sub {
    font-size: 0.75rem;
    color: var(--muted);
    font-weight: 300;
  }

  .footer {
    text-align: center;
    margin-top: 28px;
    font-size: 0.7rem;
    color: #bbb;
    animation: fadeUp 0.8s 0.6s ease forwards;
    opacity: 0;
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="avatar"><img src="HamzaLibrary.PNG.jpg" alt="مكتبة حمزة"></div>
    <h1>تواصل مع مكتبة حمزة</h1>
    <p>اختار الطريقة المناسبة ليك</p>
  </div>

  <div class="cards">
    <!-- WhatsApp -->
    <a class="btn btn-wa" href="https://wa.me/201101468269" target="_blank">
      <div class="icon-wrap">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z" fill="#25D366"/>
        </svg>
      </div>
      <div class="btn-text">
        <strong>واتساب</strong>
        <span>تابع مكتبة حمزة على واتساب</span>
      </div>
      <span class="arrow">←</span>
    </a>

    <!-- Facebook -->
    <a class="btn btn-fb" href="https://www.facebook.com/share/1cqsBCk6fi/" target="_blank">
      <div class="icon-wrap">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z" fill="#1877F2"/>
        </svg>
      </div>
      <div class="btn-text">
        <strong>فيسبوك</strong>
        <span>تابع مكتبة حمزة على فيسبوك</span>
      </div>
      <span class="arrow">←</span>
    </a>
  </div>

  <!-- QR Code -->
  <div class="qr-section">
    <div class="qr-label">امسح الـ QR</div>
    <div class="qr-wrap">
      <div id="qrcode"></div>
    </div>
    <div class="qr-sub">سيوديك لصفحة التواصل دي مباشرةً</div>
  </div>

  <div class="footer">صُنع بـ ❤️</div>
</div>

<script>
  // Generate QR for the page URL (or WhatsApp as default)
  const pageUrl = window.location.href;
  
  new QRCode(document.getElementById("qrcode"), {
    text: pageUrl,
    width: 160,
    height: 160,
    colorDark: "#000000",
    colorLight: "#ffffff",
    correctLevel: QRCode.CorrectLevel.H
  });
</script>
</body>
</html>
